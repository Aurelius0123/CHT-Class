<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현역반 - 아우라 강의 목록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .wrapper { max-width: 1200px; margin: 0 auto; }

        .back-btn {
            display: inline-block;
            margin-bottom: 16px;
            color: #a3a3a3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #fff; }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #3b82f6;
            margin: 0 0 20px 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* ── 왼쪽 강의 목록 ── */
        .list-panel {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .list-header {
            padding: 14px 18px;
            font-size: 11px;
            font-weight: 700;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #262626;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-radius: 14px 14px 0 0;
            z-index: 1;
        }
        .list-item {
            padding: 13px 18px;
            font-size: 13px;
            color: #d4d4d4;
            line-height: 1.5;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            transition: background 0.15s, color 0.15s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #222; color: #fff; }
        .list-item.active {
            background: #172554;
            color: #93c5fd;
            padding-left: 15px;
            border-left: 3px solid #3b82f6;
        }

        /* ── 오른쪽 콘텐츠 ── */
        .content { display: flex; flex-direction: column; gap: 16px; }

        .placeholder {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
        }
        .placeholder-icon { font-size: 44px; opacity: 0.4; }
        .placeholder-text { font-size: 14px; }

        #playerArea { display: flex; flex-direction: column; gap: 16px; }

        .video-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── 목차 인덱스 ── */
        .index-panel {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 20px;
        }
        .index-header {
            font-size: 11px;
            font-weight: 700;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .ch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        .ch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s;
        }
        .ch-btn:hover { background: #1e2a40; border-color: #3b82f6; }
        .ch-time {
            font-size: 12px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #3b82f6;
            white-space: nowrap;
        }
        .ch-label { font-size: 13px; color: #d4d4d4; }
        .no-ch { font-size: 13px; color: #555; padding: 4px 0; }

        @media (max-width: 720px) {
            .layout { grid-template-columns: 1fr; }
            .list-panel { position: static; max-height: 200px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="back-btn" onclick="window.location.href='go3.html'">← 이전 화면으로</div>
    <h1 class="page-title">현역반 아우라 강의 리스트</h1>

    <div class="layout">
        <aside class="list-panel">
            <div class="list-header">강의 목록</div>
            <div id="lectureList"></div>
        </aside>

        <section class="content">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">▶</div>
                <div class="placeholder-text">왼쪽에서 강의를 선택하세요</div>
            </div>

            <div id="playerArea" style="display:none">
                <div class="video-wrap">
                    <iframe id="ytFrame" allowfullscreen
                        allow="autoplay; encrypted-media; picture-in-picture"></iframe>
                </div>
                <div class="index-panel">
                    <div class="index-header">목차 (타임라인)</div>
                    <div id="indexList"></div>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
// =====================================================================
// 강의 데이터 — chapters 배열에 타임라인을 추가하세요
// 형식: { t: 초(숫자), label: "문제명" }
// 예시: { t: 0, label: "9번" }, { t: 312, label: "10번" }
// =====================================================================
const lectures = [
  {
        id: "mxyILs_sC6c",
        title: "아우라 5강 9, 10, 22, 12번",
        chapters: [
        ]
    },
  {
        id: "dPzSW2nxKMY",
        title: "아우라 4강 7, 8번",
        chapters: [
        ]
    },
  {
        id: "xywcpORw5gg",
        title: "아우라 3강 5,6번",
        chapters: [
        ]
    },
    {
        id: "KNFgQc_KO9M",
        title: "아우라 2강 3,4번",
        chapters: [
        ]
    },
    {
        id: "8lMoShecQWc",
        title: "아우라 1강 1,2번",
        chapters: [
        ]
    },
];

let currentId = null;

function toTime(t) {
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function select(idx) {
    const lec = lectures[idx];
    currentId = lec.id;

    document.querySelectorAll('.list-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
    });

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('playerArea').style.display = 'flex';

    document.getElementById('ytFrame').src =
        `https://www.youtube.com/embed/${lec.id}?autoplay=1&rel=0`;

    const list = document.getElementById('indexList');
    const active = lec.chapters.filter(ch => ch && ch.t !== undefined);
    if (!active.length) {
        list.innerHTML = '<div class="no-ch">타임라인이 아직 없습니다</div>';
    } else {
        list.innerHTML = `<div class="ch-grid">${
            active.map(ch => `
                <button class="ch-btn" onclick="seek(${ch.t})">
                    <span class="ch-time">${toTime(ch.t)}</span>
                    <span class="ch-label">${ch.label}</span>
                </button>
            `).join('')
        }</div>`;
    }

    if (window.innerWidth <= 720) {
        document.getElementById('playerArea').scrollIntoView({ behavior: 'smooth' });
    }
}

function seek(t) {
    document.getElementById('ytFrame').src =
        `https://www.youtube.com/embed/${currentId}?autoplay=1&start=${t}&rel=0`;
}

document.getElementById('lectureList').innerHTML = lectures.map((lec, i) => `
    <div class="list-item" onclick="select(${i})">${lec.title}</div>
`).join('');
</script>
</body>
</html>
