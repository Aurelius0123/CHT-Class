<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재수반 - 공통</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            margin-bottom: 16px;
            color: #a3a3a3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #fff; }
        .page-title { font-size: 22px; font-weight: 700; color: #dc2626; margin: 0 0 20px 0; }
        .layout { display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
        .list-panel {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .list-header {
            padding: 14px 18px;
            font-size: 11px;
            font-weight: 700;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #262626;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-radius: 14px 14px 0 0;
            z-index: 1;
        }
        .list-item {
            padding: 13px 18px;
            font-size: 13px;
            color: #d4d4d4;
            line-height: 1.5;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            transition: background 0.15s, color 0.15s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #222; color: #fff; }
        .list-item.active {
            background: #450a0a;
            color: #fca5a5;
            padding-left: 15px;
            border-left: 3px solid #dc2626;
        }
        .content { display: flex; flex-direction: column; gap: 16px; }
        .placeholder {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
        }
        .placeholder-icon { font-size: 44px; opacity: 0.4; }
        .placeholder-text { font-size: 14px; }
        #playerArea { display: flex; flex-direction: column; gap: 16px; }
        .video-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .index-panel { background: #1a1a1a; border: 1px solid #262626; border-radius: 12px; padding: 20px; }
        .index-header { font-size: 11px; font-weight: 700; color: #737373; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .ch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s;
        }
        .ch-btn:hover { background: #3b0a0a; border-color: #dc2626; }
        .ch-time { font-size: 12px; font-weight: 700; font-family: 'Courier New', monospace; color: #dc2626; white-space: nowrap; }
        .ch-label { font-size: 13px; color: #d4d4d4; }
        .no-ch { font-size: 13px; color: #555; padding: 4px 0; }
        @media (max-width: 720px) {
            .layout { grid-template-columns: 1fr; }
            .list-panel { position: static; max-height: 200px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="back-btn" onclick="window.location.href='jaesu.html'">← 이전 화면으로</div>
    <h1 class="page-title">재수반 공통 강의 리스트</h1>
    <div class="layout">
        <aside class="list-panel">
            <div class="list-header">강의 목록</div>
            <div id="lectureList"></div>
        </aside>
        <section class="content">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">▶</div>
                <div class="placeholder-text">왼쪽에서 강의를 선택하세요</div>
            </div>
            <div id="playerArea" style="display:none">
                <div class="video-wrap">
                    <iframe id="ytFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
                </div>
                <div class="index-panel">
                    <div class="index-header">목차 (타임라인)</div>
                    <div id="indexList"></div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
const lectures = [
    { id: "EJ4d2ZGK3U0", title: "[6-1 주간지 21번, 22번] % [10회 브릿지 14번]", chapters: [{t: 0, label "21번 (주간지)"}, {t: 1035, label:"22번 (주간지)"}, {t: 2230, label:"14번 (브릿지)"} ] },
    { id: "ssjSbw1X248", title: "[6-1 주간지 12번, 14번, 15번]", chapters: [{ t: 0, label: "12번" }, {t: 1450, label: "14번"}, {t: 2085, label: "15번"}] },
    { id: "G30l_gm8rv8", title: "[브릿지 9회 - 12번] & [5-3 주간지 - 15번]", chapters: [{ t: 0, label: "12번 (브릿지)" }, { t: 6170, label: "15번 (주간지)" }] },
    { id: "fxBcQrnwZkU", title: "[브릿지 9회 - 11번, 13번]", chapters: [{ t: 0, label: "11번" }, { t: 1165, label: "13번" }] },
    { id: "UrxACAHLNYY", title: "[브릿지 5회 - 12번, 14번]", chapters: [] },
    { id: "uF44ToBsU2I", title: "[더프 5월 - 22번] & [브릿지 4회 - 14번]", chapters: [] },
    { id: "lk3fOnd8jNk", title: "[더프 5월 - 14번, 15번, 21번]", chapters: [] },
];

let currentId = null;

function toTime(t) {
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function select(idx) {
    const lec = lectures[idx];
    currentId = lec.id;
    document.querySelectorAll('.list-item').forEach((el, i) => el.classList.toggle('active', i === idx));
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('playerArea').style.display = 'flex';
    document.getElementById('ytFrame').src = `https://www.youtube.com/embed/${lec.id}?autoplay=1&rel=0`;
    const active = lec.chapters.filter(ch => ch && ch.t !== undefined);
    document.getElementById('indexList').innerHTML = !active.length
        ? '<div class="no-ch">타임라인이 아직 없습니다</div>'
        : `<div class="ch-grid">${active.map(ch => `<button class="ch-btn" onclick="seek(${ch.t})"><span class="ch-time">${toTime(ch.t)}</span><span class="ch-label">${ch.label}</span></button>`).join('')}</div>`;
    if (window.innerWidth <= 720) document.getElementById('playerArea').scrollIntoView({ behavior: 'smooth' });
}

function seek(t) {
    document.getElementById('ytFrame').src = `https://www.youtube.com/embed/${currentId}?autoplay=1&start=${t}&rel=0`;
}

document.getElementById('lectureList').innerHTML = lectures.map((lec, i) =>
    `<div class="list-item" onclick="select(${i})">${lec.title}</div>`).join('');
</script>
</body>
</html>
