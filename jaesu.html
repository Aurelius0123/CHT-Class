<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재수반</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wrapper {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
            color: #a3a3a3;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #ffffff; }
        .main-banner {
            background: linear-gradient(135deg, #991b1b 0%, #dc2626 40%, #f97316 100%);
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .banner-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
        }
        .banner-desc {
            font-size: 14px;
            opacity: 0.8;
            margin: 0;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 600px) {
            .card-container { grid-template-columns: 1fr; }
        }
        .card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 35px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            border: 1px solid #262626;
        }
        .card:hover {
            background-color: #242424;
            transform: translateY(-3px);
        }
        .card-info { display: flex; flex-direction: column; gap: 6px; }
        .card-title { font-size: 20px; font-weight: 700; color: #ffffff; }
        .card-sub { font-size: 13px; color: #a3a3a3; }
        .arrow { font-size: 18px; color: #a3a3a3; font-weight: 300; }
        .card:hover .arrow { color: #ffffff; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="back-btn" onclick="window.location.href='index.html'">← 메인 화면으로</div>
        <div class="main-banner">
            <h1 class="banner-title">재수반 영상 저장소</h1>
            <p class="banner-desc"></p>
        </div>
       
            <div class="card" onclick="window.location.href='jaesu_gt.html'">
                <div class="card-info">
                    <span class="card-title">공통</span>
                    <span class="card-sub">공통 강의 리스트</span>
                </div>
                <div class="arrow">＞</div>

                 <div class="card-container">
            <div class="card" onclick="window.location.href='jaesu_mj.html'">
                <div class="card-info">
                    <span class="card-title">미적분</span>
                    <span class="card-sub">미적분 강의 리스트</span>
                </div>
                <div class="arrow">＞</div>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
