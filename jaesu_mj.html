<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재수반 - 미적분</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            margin-bottom: 16px;
            color: #a3a3a3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #fff; }
        .page-title { font-size: 22px; font-weight: 700; color: #dc2626; margin: 0 0 20px 0; }
        .layout { display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
        .list-panel {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .list-header {
            padding: 14px 18px;
            font-size: 11px;
            font-weight: 700;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #262626;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-radius: 14px 14px 0 0;
            z-index: 1;
        }
        .list-item {
            padding: 13px 18px;
            font-size: 13px;
            color: #d4d4d4;
            line-height: 1.5;
            cursor: pointer;
            border-bottom: 1px solid #1e1e1e;
            transition: background 0.15s, color 0.15s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #222; color: #fff; }
        .list-item.active {
            background: #450a0a;
            color: #fca5a5;
            padding-left: 15px;
            border-left: 3px solid #dc2626;
        }
        .content { display: flex; flex-direction: column; gap: 16px; }
        .placeholder {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 14px;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
        }
        .placeholder-icon { font-size: 44px; opacity: 0.4; }
        .placeholder-text { font-size: 14px; }
        #playerArea { display: flex; flex-direction: column; gap: 16px; }
        .video-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .index-panel { background: #1a1a1a; border: 1px solid #262626; border-radius: 12px; padding: 20px; }
        .index-header { font-size: 11px; font-weight: 700; color: #737373; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .ch-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s;
        }
        .ch-btn:hover { background: #3b0a0a; border-color: #dc2626; }
        .ch-time { font-size: 12px; font-weight: 700; font-family: 'Courier New', monospace; color: #dc2626; white-space: nowrap; }
        .ch-label { font-size: 13px; color: #d4d4d4; }
        .no-ch { font-size: 13px; color: #555; padding: 4px 0; }
        @media (max-width: 720px) {
            .layout { grid-template-columns: 1fr; }
            .list-panel { position: static; max-height: 200px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="back-btn" onclick="window.location.href='jaesu.html'">← 이전 화면으로</div>
    <h1 class="page-title">재수반 미적분 강의 리스트</h1>
    <div class="layout">
        <aside class="list-panel">
            <div class="list-header">강의 목록</div>
            <div id="lectureList"></div>
        </aside>
        <section class="content">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">▶</div>
                <div class="placeholder-text">왼쪽에서 강의를 선택하세요</div>
            </div>
            <div id="playerArea" style="display:none">
                <div class="video-wrap">
                    <iframe id="ytFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
                </div>
                <div class="index-panel">
                    <div class="index-header">목차 (타임라인)</div>
                    <div id="indexList"></div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
const lectures = [
    { id: "KtE3ctrkBQo", title: "[블듀 모고 21, 30]", chapters: [] },
    { id: "KtE3ctrkBQo", title: "[7모 22, 29, 30]", chapters: [] },
    { id: "GA9l1N75pz4", title: "[해인수 미적 (적분법) - 33번, 34번, 41번, 45번, 46번]", chapters: [{ t: 0, label: "33번" },{ t: 840, label: "34번" },{ t: 3060, label: "41번" },{ t: 3480, label: "45번" },{ t: 5400, label: "46번" }] },
    { id: "f8RhH8sJ1uU", title: "[해인수 미적 (적분법) - 29번, 31번]", chapters: [{ t: 0, label: "29번" },{ t: 390, label: "31번" }] },
    { id: "ssYHuDJ3Cow", title: "[해인수 미적 (적분법) - 25번, 26번]", chapters: [{ t: 0, label: "25번" },{ t: 1030, label: "26번" }] },
    { id: "pUqjqik0gOk", title: "[해인수 미적 (적분법) - 21번, 23번]", chapters: [{ t: 0, label: "21번" },{ t: 2460, label: "23번" }] },
    { id: "QDWMpKt_ydg", title: "[해인수 미적 (적분법) - 19번, 20번]", chapters: [{t:0, label:"19번"},{t:1750, label:"20번"}] },
    { id: "zLWAUNe82hE", title: "[수특 미적분 step 3 - 1번, step 2 - 7번] & [해인수 미적 (적분법) - 17번, 18번]", chapters: [{t: 0, label: "1번 (수특)"},{t:670, label: "7번 (수특)"},{t: 980, label: "17번 (해인수)"},{t:9120, label:"18번 (해인수)"}] },
    { id: "CoHXliiDYsc", title: "[해인수 미적 (적분법) - 15번, 16번]", chapters: [{ t: 0, label: "15번" }, { t: 1440, label: "16번" }] },
    { id: "9me8tnEhDCs", title: "[해인수 미적 (적분법) - 9번, 10번, 13번, 14번]", chapters: [{ t: 0, label: "9번" }, { t: 630, label: "10번" }, { t: 2160, label: "13번" }, { t: 2940, label: "14번" }] },
    { id: "V4nFJihdnvE", title: "[해인수 미적 (적분법) - 7번, 8번]", chapters: [{ t: 0, label: "7번" }, { t: 1260, label: "8번" }] },
    { id: "qSV04pO9FD8", title: "[수특 Lv3 - 2번]", chapters: [{ t: 0, label: "2번" }] },
    { id: "9WYb4arLFeg", title: "[6모 미적분 - 28번, 29번, 30번]", chapters: [{ t: 0, label: "28번" }, { t: 1320, label: "29번" }, { t: 2130, label: "30번" }] },
    { id: "-NColbzSAIM", title: "[해인수 미적 (적분법) - 3번, 4번, 5번, 6번]", chapters: [{ t: 0, label: "3번 (적분법)" }, { t: 1275, label: "4번 (적분법)" }, { t: 1980, label: "5번 (적분법)" }, { t: 2980, label: "6번 (적분법)" }] },
    { id: "HIBg0IAeSIo", title: "[해인수 미적 (적분법) - 2번]", chapters: [] },
    { id: "72I8NuKIl_8", title: "[해인수 미적 (미분법) - 71번, 72번]", chapters: [] },
    { id: "j4ZjiIMEyBw", title: "[더프 5월 - 29번, 30번] & [해인수 미적 (미분법) - 54번, 60번]", chapters: [] },
    { id: "GuLah4YphTc", title: "[해인수 미적 (미분법) - 65번, 66번, 67번, 69번]", chapters: [] },
];

let currentId = null;

function toTime(t) {
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function select(idx) {
    const lec = lectures[idx];
    currentId = lec.id;
    document.querySelectorAll('.list-item').forEach((el, i) => el.classList.toggle('active', i === idx));
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('playerArea').style.display = 'flex';
    document.getElementById('ytFrame').src = `https://www.youtube.com/embed/${lec.id}?autoplay=1&rel=0`;
    const active = lec.chapters.filter(ch => ch && ch.t !== undefined);
    document.getElementById('indexList').innerHTML = !active.length
        ? '<div class="no-ch">타임라인이 아직 없습니다</div>'
        : `<div class="ch-grid">${active.map(ch => `<button class="ch-btn" onclick="seek(${ch.t})"><span class="ch-time">${toTime(ch.t)}</span><span class="ch-label">${ch.label}</span></button>`).join('')}</div>`;
    if (window.innerWidth <= 720) document.getElementById('playerArea').scrollIntoView({ behavior: 'smooth' });
}

function seek(t) {
    document.getElementById('ytFrame').src = `https://www.youtube.com/embed/${currentId}?autoplay=1&start=${t}&rel=0`;
}

document.getElementById('lectureList').innerHTML = lectures.map((lec, i) =>
    `<div class="list-item" onclick="select(${i})">${lec.title}</div>`).join('');
</script>
</body>
</html>
