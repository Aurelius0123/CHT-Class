<!DOCTYPE html>
<html lang="ko">
<head>
   <!-- 카톡 제목 -->
  <meta property="og:title" content="철호T의 수업 영상 저장소">
  
  <!-- ⚠️ 여기 주소를 꼭 새 도메인으로 고쳐주세요! -->
  <meta property="og:image" content="https://cht-class.co.kr/images/math.jpg">
  
  <!-- 설명글 칸은 비워두기 -->
  <meta property="og:description" content="">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철호T의 수업 영상 저장소</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wrapper {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        /* 🌌 상단 와이드 그라데이션 배너 */
        .main-banner {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 30%, #8b5cf6 70%, #6d28d9 100%);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .banner-sub {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        .banner-title {
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: -1px;
        }
        .banner-desc {
            font-size: 14px;
            opacity: 0.7;
            line-height: 1.5;
            margin: 0;
        }
        /* 🗂️ 하단 수강반 카드 섹션 */
        .card-container {
            display: flex;
            gap: 20px;
        }
        .card {
            flex: 1;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 35px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            border: 1px solid #262626;
        }
        .card:hover {
            background-color: #242424;
            transform: translateY(-3px);
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }
        .card-sub {
            font-size: 13px;
            color: #a3a3a3;
        }
        .arrow {
            font-size: 18px;
            color: #a3a3a3;
            font-weight: 300;
            transition: color 0.2s ease;
        }
        .card:hover .arrow {
            color: #ffffff;
        }
        @media (max-width: 600px) {
            .card-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="main-banner">
            <div class="banner-sub">복습 강의실</div>
            <h1 class="banner-title">철호T의 수업 영상 저장소</h1>
            <p class="banner-desc"></p>
        </div>

        <div class="card-container">
            <div class="card" onclick="window.location.href='go3.html'">
                <div class="card-info">
                    <span class="card-title">고3반</span>
                    <span class="card-sub">고3반 전용 영상 저장소</span>
                </div>
                <div class="arrow">＞</div>
            </div>

            <div class="card" onclick="window.location.href='approach_jaesu.html'">
                <div class="card-info">
                    <span class="card-title">재수반</span>
                    <span class="card-sub">재수반 전용 영상 저장소</span>
                </div>
                <div class="arrow">＞</div>
            </div>
        </div>
    </div>

</body>
</html>
